<text x="1195" y="1320" text-anchor="middle" class="section">Criterio de organización</text>
<text x="1195" y="1353" text-anchor="middle" class="small">Cada carpeta agrupa responsabilidades relacionadas con una etapa del análisis, evitando mezclar la CLI, el parsing, las reglas y los reportes.</text>
<text x="1195" y="1380" text-anchor="middle" class="small">La estructura podrá ajustarse durante la implementación siempre que se mantenga la separación definida por la arquitectura.</text>
