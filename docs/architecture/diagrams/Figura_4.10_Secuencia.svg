<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1600" viewBox="0 0 2500 1600">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#2f2f2f"/>
  </marker>
  <marker id="openArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10" fill="none" stroke="#2f2f2f" stroke-width="1.5"/>
  </marker>
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 600; fill: #333333; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #333333; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #333333; }
    .participant { fill: #ece9ff; stroke: #9b8af7; stroke-width: 2.2; rx: 18; ry: 18; }
    .system { fill: #f7f6dc; fill-opacity: 0.58; stroke: #b7b062; stroke-width: 2.2; rx: 24; ry: 24; }
    .lifeline { stroke: #6f6f6f; stroke-width: 1.6; stroke-dasharray: 8 8; }
    .message { fill: none; stroke: #2f2f2f; stroke-width: 2; marker-end: url(#arrow); }
    .return { fill: none; stroke: #2f2f2f; stroke-width: 1.8; stroke-dasharray: 8 6; marker-end: url(#openArrow); }
    .activation { fill: #ddd7ff; stroke: #9b8af7; stroke-width: 1.7; }
    .fragment { fill: #ffffff; fill-opacity: 0.22; stroke: #8a8a8a; stroke-width: 1.8; rx: 12; ry: 12; }
    .fragment-head { fill: #ece9ff; stroke: #8a8a8a; stroke-width: 1.5; }
    .separator { stroke: #8a8a8a; stroke-width: 1.3; stroke-dasharray: 7 6; }
  </style>
</defs>

