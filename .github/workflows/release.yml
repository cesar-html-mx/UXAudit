name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.16.0

      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFile, readFile } from 'node:fs/promises';
          import process from 'node:process';

          const tag = process.env.RELEASE_TAG ?? '';
          const match = /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$/.exec(tag);
          if (match === null) {
            throw new Error(`Release tag is not valid SemVer: ${tag}`);
          }

          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const version = match[1];
          if (pkg.version !== version) {
            throw new Error(`Tag ${tag} does not match package version ${pkg.version}.`);
          }

          const distTag = version.includes('-') ? 'next' : 'latest';
          await appendFile(process.env.GITHUB_ENV, `NPM_DIST_TAG=${distTag}\n`, 'utf8');
          EOF

      - name: Require release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Install locked dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Run release quality gate
        run: npm run release:check

      - name: Publish with trusted provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --ignore-scripts --provenance --tag "$NPM_DIST_TAG"
