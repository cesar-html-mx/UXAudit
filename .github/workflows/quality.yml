name: Product Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Detect product scaffold
        id: product
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.product.outputs.ready == 'true'
        run: npm ci

      - name: Run quality gate
        if: steps.product.outputs.ready == 'true'
        run: node .github/harness/scripts/check-quality.mjs

      - name: Harness-only repository
        if: steps.product.outputs.ready != 'true'
        run: echo "Product scaffold will be created during M01."
