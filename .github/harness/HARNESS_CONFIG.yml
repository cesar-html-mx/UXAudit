schema_version: 1
project: UXAudit
execution:
  run_mode: milestone
  auto_continue_within_milestone: true
  stop_after_milestone: true
  inspect_before_implementing: true
  self_review_before_closure: true
version_control:
  branch_policy: milestone
  branch_pattern: "milestone/{milestone_id}-{slug}"
  commit_policy: task
  push_policy: task
  create_pull_request_at_milestone: true
  auto_merge: false
  conventional_commits: true
quality:
  require_clean_worktree_at_close: true
  require_build: true
  require_typecheck: true
  require_lint: true
  require_format_check: true
  require_tests: true
  require_docs: true
  require_traceability: true
  require_evidence: true
autonomy:
  allow_documentation_updates: true
  allow_test_refactors: true
  allow_approved_dev_dependencies: true
  allow_new_production_dependencies: false
  allow_contract_changes_after_completion: false
  allow_scope_expansion: false
  allow_destructive_git_operations: false
blockers:
  stop_on_missing_credentials: false
  stop_on_architecture_change: true
  stop_on_scope_change: true
  stop_on_irreversible_ambiguity: true
